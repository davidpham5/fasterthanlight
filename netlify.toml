[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Old domains → new primary (add these domains as aliases in Netlify first).
[[redirects]]
  from = "https://thisismynext.photos/*"
  to = "https://fasterthanlight.studio/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thisismynext.photos/*"
  to = "https://fasterthanlight.studio/:splat"
  status = 301
  force = true

# The Portraits set was first published under a misspelled folder name.
[[redirects]]
  from = "/gallery/protraits"
  to = "/gallery/portraits"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noai, noimageai"
    # EU text-and-data-mining opt-out (TDMRep). Netlify doesn't add these headers to proxied /img
    # responses; robots.txt and /.well-known/tdmrep.json cover those paths.
    tdm-reservation = "1"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
